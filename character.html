<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phymo心跳實驗</title>
  <link rel="preload" as="image" href="assets/page-character.webp">
  <link rel="stylesheet" href="app.css">
  <script src="storage.js"></script>
  <script src="auth-guard.js"></script>
</head>
<body>
<!-- 這不是 bug，是我每次遇見妳都會重複觸發的事件。 -->
<!-- access denied: 其他人不可讀取此段心動紀錄。 -->
  <main class="screen office-screen parallax-office character-screen" aria-label="墨非臥室頁">
    <div class="office-parallax-stage" aria-hidden="true">
      <div class="office-panorama"></div>
      <div class="office-light"></div>
    </div>
    <div class="office-logo" aria-label="Phymo 心跳實驗">
      <img src="assets/logo-text.png" alt="Phymo 心跳實驗">
    </div>

    <nav class="office-menu" aria-label="辦公室選單"></nav>

    <section class="office-title is-empty" aria-label="目前位置" aria-live="polite">
      <h1></h1>
      <p></p>
    </section>

    <section class="character-stage" aria-label="墨非角色互動">
      <button class="character-portrait-button" type="button" aria-label="和墨非對話">
        <img class="character-portrait" src="assets/character-mophy.png" alt="墨非">
      </button>

      <section class="character-dialog" aria-live="polite">
        <div class="character-dialog-speaker">
          <span>MOPHY</span>
          <strong>墨非</strong>
        </div>
        <p class="character-dialog-text">妳來了，我剛好在等妳。</p>
        <button class="character-next-line" type="button">下一句 ➤</button>
      </section>

      <nav class="character-emotions" aria-label="情緒選擇">
        <button type="button" data-emotion="normal" class="is-active"><img src="assets/icons/icon-normal.png" alt="">日常</button>
        <button type="button" data-emotion="smile"><img src="assets/icons/icon-smile.png" alt="">溫柔</button>
        <button type="button" data-emotion="tease"><img src="assets/icons/icon-tease.png" alt="">逗弄</button>
        <button type="button" data-emotion="shy"><img src="assets/icons/icon-shy.png" alt="">害羞</button>
        <button type="button" data-emotion="serious"><img src="assets/icons/icon-serious.png" alt="">認真</button>
        <button type="button" data-emotion="jealous"><img src="assets/icons/icon-jealous.png" alt="">吃醋</button>
        <button type="button" data-emotion="comfort"><img src="assets/icons/icon-comfort.png" alt="">安慰</button>
        <button type="button" data-emotion="heartbeat"><img src="assets/icons/icon-heartbeat.png" alt="">心動</button>
      </nav>
    </section>

    <a class="office-profile" href="office.html" aria-label="角色資料">
      <img src="assets/card-3.jpeg" alt="">
      <span>
        <strong>墨非</strong>
        <small>Lv.99</small>
      </span>
      <i></i>
    </a>

    <a class="office-next" href="love-letter.html" aria-label="前往情書集">
      <img src="assets/logo-go-letter.png" alt="前往情書集">
    </a>
  </main>
  <script src="menu.js"></script>
  <script src="audio.js"></script>
  <script>
    const office = document.querySelector(".parallax-office");
    const officeTitle = document.querySelector(".office-title");
    const officeTitleText = officeTitle.querySelector("h1");
    const officeDescription = officeTitle.querySelector("p");
    let isDragging = false;
    let startX = 0;
    let startY = 0;
    let currentX = 0;
    let currentY = 0;

    const clamp = (value, min, max) => Math.min(Math.max(value, min), max);

    function setParallax(x, y) {
      currentX = clamp(x, -1, 1);
      currentY = clamp(y, -1, 1);
      office.style.setProperty("--office-x", currentX.toFixed(3));
      office.style.setProperty("--office-y", currentY.toFixed(3));
      office.style.setProperty("--stage-tilt-x", `${(-currentY * 4).toFixed(2)}deg`);
      office.style.setProperty("--stage-tilt-y", `${(currentX * 5).toFixed(2)}deg`);
      office.style.setProperty("--stage-shift-x", `${(-currentX * 10).toFixed(1)}px`);
      office.style.setProperty("--stage-shift-y", `${(-currentY * 8).toFixed(1)}px`);
      office.style.setProperty("--scene-shift-x", `${(-currentX * 72).toFixed(1)}px`);
      office.style.setProperty("--scene-shift-y", `${(-currentY * 24).toFixed(1)}px`);
      office.style.setProperty("--light-x", `${(54 + currentX * 12).toFixed(1)}%`);
      office.style.setProperty("--light-y", `${(38 + currentY * 9).toFixed(1)}%`);
      office.style.setProperty("--light-alt-x", `${(78 - currentX * 9).toFixed(1)}%`);
      office.style.setProperty("--light-alt-y", `${(28 + currentY * 5).toFixed(1)}%`);
      office.style.setProperty("--light-shift-x", `${(currentX * 34).toFixed(1)}px`);
      office.style.setProperty("--light-shift-y", `${(currentY * 18).toFixed(1)}px`);
    }

    office.addEventListener("pointerdown", (event) => {
      if (event.target.closest("a, button")) return;
      isDragging = true;
      startX = event.clientX - currentX * 240;
      startY = event.clientY - currentY * 180;
      office.classList.add("is-dragging");
      office.setPointerCapture(event.pointerId);
    });

    office.addEventListener("pointermove", (event) => {
      if (!isDragging) return;
      setParallax((event.clientX - startX) / 240, (event.clientY - startY) / 180);
    });

    function stopDragging(event) {
      if (!isDragging) return;
      isDragging = false;
      office.classList.remove("is-dragging");
      if (office.hasPointerCapture(event.pointerId)) {
        office.releasePointerCapture(event.pointerId);
      }
    }

    office.addEventListener("pointerup", stopDragging);
    office.addEventListener("pointercancel", stopDragging);
    office.addEventListener("dblclick", () => setParallax(0, 0));

    const characterPortrait = document.querySelector(".character-portrait");
    const characterPortraitButton = document.querySelector(".character-portrait-button");
    const characterDialogText = document.querySelector(".character-dialog-text");
    const characterNextLine = document.querySelector(".character-next-line");
    const emotionButtons = document.querySelectorAll(".character-emotions button");
    const emotions = ["normal", "smile", "tease", "shy", "serious", "jealous", "comfort", "heartbeat"];
    const emotionImages = Object.fromEntries(
      emotions.map((emotion) => [emotion, `assets/character/mophy-${emotion}.png`])
    );
    const fallbackDialog = {
      normal: ["妳來了，我剛好在等妳。", "今天的時間，我可以全部留給妳。"],
      smile: ["妳這樣笑，真的很犯規。", "看到妳笑，我好像就沒辦法冷靜了。"],
      tease: ["又在偷看我？不打算承認嗎。", "這麼靠近，是在邀請我嗎？"],
      shy: ["別一直看著我，我會分心。", "妳這樣靠太近了……我會亂掉。"],
      serious: ["我說的每一句話，都是認真的。", "妳對我來說，不是可以隨便對待的人。"],
      jealous: ["妳對別人也會這樣嗎？", "我不喜歡妳把注意力給別人。"],
      comfort: ["沒事的，我在這裡。", "妳不用撐著，可以靠過來。"],
      heartbeat: ["現在的心跳，好像比剛才更快。", "妳靠近的時候，我會忘記怎麼冷靜。"]
    };
    let dialogData = {};
    let currentEmotion = "normal";
    let lastLine = "";

    function pickLine(emotion) {
      const lines = Array.isArray(dialogData[emotion]) ? dialogData[emotion] : [];
      if (!lines.length) return "今天想聽我說什麼？";
      if (lines.length === 1) return lines[0];

      let nextLine = lastLine;
      while (nextLine === lastLine) {
        nextLine = lines[Math.floor(Math.random() * lines.length)];
      }

      lastLine = nextLine;
      return nextLine;
    }

    function setEmotion(emotion, shouldSpeak = true) {
      currentEmotion = emotion;
      characterPortrait.src = emotionImages[emotion] || "assets/character-mophy.png";
      characterPortrait.alt = `墨非-${emotion}`;

      emotionButtons.forEach((button) => {
        button.classList.toggle("is-active", button.dataset.emotion === emotion);
      });

      if (shouldSpeak) {
        characterDialogText.textContent = pickLine(emotion);
        characterPortraitButton.classList.remove("is-speaking");
        requestAnimationFrame(() => characterPortraitButton.classList.add("is-speaking"));
      }
    }

    async function loadDialog() {
      try {
        const response = await fetch("assets/dialog.json", { cache: "no-store" });
        dialogData = response.ok ? await response.json() : fallbackDialog;
      } catch (error) {
        dialogData = fallbackDialog;
      }

      setEmotion("normal");
    }

    characterPortraitButton.addEventListener("click", () => {
      const emotion = emotions[Math.floor(Math.random() * emotions.length)];
      setEmotion(emotion);
    });

    characterNextLine.addEventListener("click", () => setEmotion(currentEmotion));
    emotionButtons.forEach((button) => {
      button.addEventListener("click", () => setEmotion(button.dataset.emotion));
    });

    loadDialog();

    initPhymoMenu({
      menuSelector: ".office-menu",
      titlePanelSelector: ".office-title",
      titleSelector: ".office-title h1",
      descSelector: ".office-title p",
    });
  </script>
</body>
</html>
