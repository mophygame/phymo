<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phymo心跳實驗</title>
  <link rel="preload" as="image" href="assets/page-login.webp">
  <link rel="stylesheet" href="app.css">
<!-- TODO: 修正這段邏輯。以及，今天又多看了妳三秒。 -->
<!-- FIXME: 心跳頻率異常，疑似因妳靠近導致。 -->
</head>
<body>
  <main class="screen cover login-screen" aria-label="墨非戀愛博登入頁">
    <form class="login-card" action="office.html" method="get">
      <h1>✨ 歡迎回來 ✨</h1>

      <label class="login-field">
        <span>暱稱</span>
        <input type="text" name="nickname" autocomplete="nickname" placeholder="輸入暱稱" aria-label="暱稱">
      </label>

      <label class="login-field">
        <span>密碼</span>
        <span class="password-control">
          <input type="password" name="password" autocomplete="current-password" placeholder="輸入密碼" aria-label="密碼">
          <button class="password-toggle" type="button" aria-label="顯示密碼" aria-pressed="false">顯示</button>
        </span>
      </label>

      <label class="login-check">
        <input type="checkbox" name="remember">
        <span>記住我</span>
      </label>

      <p class="login-message" aria-live="polite"></p>
      <button class="login-button" type="submit">登入</button>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/supabase-config.js"></script>
  <script src="storage.js"></script>
  <script src="login.js"></script>
  <script src="audio.js"></script>
</body>
</html>
