    function renderLocationSelect() {

    function renderFragments() {
      fragmentTray.replaceChildren();
      activeLocation.fragments.forEach((fragment) => {
        if (collectedFragments.has(fragment)) return;
        const button = document.createElement("button");
        const position = getFragmentPosition(activeLocation.id, fragment);
        button.type = "button";
        button.dataset.fragment = fragment;
        button.style.left = `${position.x}%`;
        button.style.top = `${position.y}%`;
        button.innerHTML = `
          <span><img src="assets/icons/piece.webp" alt=""></span>

        `;
        button.addEventListener("click", () => collectFragment(fragment, button));
        fragmentTray.append(button);
      });

    function getFragmentPosition(locationId, fragment) {
      const key = `${locationId}-${fragment}`;
      if (!fragmentPositions.has(key)) {
        fragmentPositions.set(key, createFragmentPosition());
      }
      return fragmentPositions.get(key);
    }

    function createFragmentPosition() {
      let position = { x: 50, y: 50 };
      for (let attempt = 0; attempt < 40; attempt += 1) {
        position = {
          x: 10 + Math.random() * 80,
          y: 18 + Math.random() * 58
        };

        const overlapsLocationCard = position.x < 35 && position.y < 45;
        const overlapsTopButtons = position.x > 55 && position.y < 32;
        if (!overlapsLocationCard && !overlapsTopButtons) return position;
      }
      return position;
    }

        piece.className = `clue-piece${isCollected ? " is-collected" : ""}`;
        piece.style.setProperty("--piece-x", index % 6);
        piece.style.setProperty("--piece-y", Math.floor(index / 6));
        piece.style.backgroundImage = `url("${puzzleImage}")`;
        piece.textContent = isCollected ? "" : String(index + 1).padStart(2, "0");
        cluePuzzle.append(piece);
      }
      clueProgress.textContent = `${collectedFragments.size} / ${puzzleTotal}`;
      const isComplete = collectedFragments.size >= puzzleTotal;
      cluePassword.hidden = !isComplete;
      if (isComplete) {
        cluePassword.textContent = videoPassword;
      }
      renderLocationSelect();
    }

    function collectFragment(fragment, trigger) {
      if (collectedFragments.has(fragment)) return;
      trigger.disabled = true;
      trigger.classList.add("is-picking");
      window.setTimeout(() => {
        finishCollectFragment(fragment);
      }, 560);
    }

    function finishCollectFragment(fragment) {
      collectedFragments.add(fragment);
      dialogueText.textContent = `找到第 ${String(fragment + 1).padStart(2, "0")} 片拼圖了。先放進線索蒐集裡，等等一起拼成線索。`;
      renderFragments();
      renderClues();
    }

    function activateLocation(id) {
      const location = locations.find((item) => item.id === id) || locations[0];
      activeLocation = location;
      dialogueIndex = 0;
      sceneImage.classList.add("is-changing");
      window.setTimeout(() => {
        sceneImage.src = location.image;
        sceneImage.alt = location.name;
        sceneImage.classList.remove("is-changing");
      }, 160);
      locationTitle.textContent = location.name;
      locationDesc.textContent = location.desc;
      characterImage.src = location.character;
      dialogueText.textContent = location.lines[0];
      renderFragments();
      renderLocationSelect();
    }

    dialogueNext.addEventListener("click", () => {
      dialogueIndex = (dialogueIndex + 1) % activeLocation.lines.length;
      dialogueText.textContent = activeLocation.lines[dialogueIndex];
    });

    document.querySelectorAll(".bag-button, .map-square-button, .clue-square-button").forEach((button) => {
      button.addEventListener("click", () => {
        const modal = document.querySelector(`[data-modal="${button.dataset.bag}"]`);
        if (modal) {
          modal.hidden = false;
          if (button.dataset.bag === "video" && !videoUnlocked) {
            window.setTimeout(() => videoPasswordInput.focus(), 80);
          }
        }
      });
    });

    document.querySelectorAll(".modal-close").forEach((button) => {
      button.addEventListener("click", () => {
        const modal = button.closest(".bag-modal");
        modal.hidden = true;
        stopBagMedia();
      });
    });

    document.querySelectorAll(".bag-modal").forEach((modal) => {
      modal.addEventListener("click", (event) => {
        if (event.target === modal) {
          modal.hidden = true;
          stopBagMedia();
        }
      });
    });

    function stopBagMedia() {
      bagVideo.pause();
      bagYoutube.src = "about:blank";
      resumeBgMusic();
    }

    async function playBgMusic() {
      if (!bgMusicEnabled) return;
      try {
        await bgMusic.play();
        musicToggle.textContent = "音樂暫停";
        musicToggle.setAttribute("aria-pressed", "true");
      } catch (error) {
        musicToggle.textContent = "音樂繼續";
        musicToggle.setAttribute("aria-pressed", "false");
      }
    }

    function pauseBgMusic() {
      bgMusic.pause();
      musicToggle.textContent = "音樂繼續";
      musicToggle.setAttribute("aria-pressed", "false");
    }

    function resumeBgMusic() {
      if (bgMusicEnabled) playBgMusic();
    }

    function toggleBgMusic() {
      bgMusicEnabled = bgMusic.paused;
      if (bgMusicEnabled) {
        playBgMusic();
      } else {
        pauseBgMusic();
      }
    }

    musicToggle.addEventListener("click", toggleBgMusic);
    document.addEventListener("pointerdown", playBgMusic, { once: true });
    document.addEventListener("keydown", playBgMusic, { once: true });

    function unlockVideo() {
      const value = videoPasswordInput.value.trim();
      if (value !== videoPassword) {
        videoLockMessage.textContent = "密碼錯誤，請回線索蒐集確認。";
        videoPasswordInput.select();
        return;
      }
      videoUnlocked = true;
      tabletDevice.classList.remove("is-locked");
      videoLockMessage.textContent = "";
    }

    videoUnlockButton.addEventListener("click", unlockVideo);
    videoPasswordInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") unlockVideo();
    });

    document.querySelectorAll(".bag-video-list button").forEach((button) => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".bag-video-list button").forEach((item) => item.classList.remove("is-active"));
        button.classList.add("is-active");
        if (button.dataset.videoType === "youtube") {
          bagVideo.pause();
          pauseBgMusic();
          bagVideo.hidden = true;
          bagYoutube.hidden = false;
          bagYoutube.src = button.dataset.youtubeSrc;
          return;
        }
        bagYoutube.src = "about:blank";
        bagYoutube.hidden = true;
        bagVideo.hidden = false;
        pauseBgMusic();
        bagVideo.poster = button.dataset.videoPoster;
        bagVideo.src = button.dataset.videoSrc;
        bagVideo.load();
      });
    });

    bagVideo.addEventListener("play", pauseBgMusic);

    function renderPhotos(photos) {
      photoGrid.replaceChildren();
      photos.forEach((photo) => {
        const button = document.createElement("button");
        button.type = "button";
        button.dataset.photoSrc = photo.src;
        button.dataset.photoCaption = photo.title;
        button.innerHTML = `
          <img src="${photo.src}" alt="${photo.title}" loading="lazy">
          <span>${photo.title}</span>
        `;
        photoGrid.append(button);
      });
    }

    async function loadPhotos() {
      try {
        const response = await fetch("assets/companyphoto.json", { cache: "no-store" });
        if (!response.ok) throw new Error("photo json unavailable");
        const photos = await response.json();
        renderPhotos(photos);
      } catch (error) {
        renderPhotos(fallbackPhotos);
      }
    }

    photoGrid.addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      const image = lightbox.querySelector("img");
      image.src = button.dataset.photoSrc;
      image.alt = button.dataset.photoCaption;
      lightbox.querySelector("figcaption").textContent = button.dataset.photoCaption;
      lightbox.hidden = false;
    });

    document.querySelector(".lightbox-close").addEventListener("click", () => {
      lightbox.hidden = true;
    });

    lightbox.addEventListener("click", (event) => {
      if (event.target === lightbox) lightbox.hidden = true;
    });

    document.addEventListener("keydown", (event) => {
      if (event.key !== "Escape") return;
      document.querySelectorAll(".bag-modal").forEach((modal) => modal.hidden = true);
      lightbox.hidden = true;
      stopBagMedia();
    });

    document.querySelector(".map-stage").addEventListener("pointermove", (event) => {
      const bounds = event.currentTarget.getBoundingClientRect();
      const x = ((event.clientX - bounds.left) / bounds.width) * 2 - 1;
      const y = ((event.clientY - bounds.top) / bounds.height) * 2 - 1;
      event.currentTarget.style.setProperty("--look-x", x.toFixed(3));
      event.currentTarget.style.setProperty("--look-y", y.toFixed(3));
    });

    document.querySelector(".map-stage").addEventListener("pointerleave", (event) => {
      event.currentTarget.style.setProperty("--look-x", "0");
      event.currentTarget.style.setProperty("--look-y", "0");
    });

    activateLocation("hall");
    renderClues();
    loadPhotos();
  </script>
</body>
</html>
