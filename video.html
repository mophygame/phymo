<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phymo心跳實驗</title>
  <link rel="preload" as="image" href="assets/office/hall.webp">
  <link rel="preload" as="image" href="assets/character-mophy.png">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="video.css">
</head>
<body>
  <main class="otome-map" aria-label="Phymo 辦公室探索遊戲">
    <header class="map-hud">
      <div class="brand">
        <h1>小破群開發中<span>.exe</span></h1>
      </div>
      <section class="hud-bag-actions" aria-label="背包功能">
        <button class="bag-button" type="button" data-bag="video">
          <span><img src="assets/icons/phone.webp" alt="" loading="lazy"></span>
          <strong>手機影片</strong>
        </button>
        <button class="bag-button" type="button" data-bag="photo">
          <span><img src="assets/icons/board.webp" alt="" loading="lazy"></span>
          <strong>佈告欄</strong>
        </button>
      </section>
      <nav class="hud-actions" aria-label="快捷功能">
        <button class="music-toggle" type="button" aria-pressed="false">音樂繼續</button>
        <a href="index.html">結束</a>
      </nav>
    </header>

    <section class="map-stage" aria-label="探索地圖">
      <div class="scene-layer" aria-live="polite">
        <img class="scene-image" src="assets/office/hall.webp" alt="辦公大廳">
        <span class="scene-glow" aria-hidden="true"></span>
      </div>

      <div class="map-pins" aria-label="可探索地點"></div>

      <aside class="location-card">
        <small>NOW EXPLORING</small>
        <h2>辦公大廳</h2>
        <p>水族箱映著晨光，新的企劃似乎正在悄悄發芽。</p>
      </aside>

      <section class="fragment-tray" aria-label="可收集拼圖碎片"></section>

      <figure class="character-stand">
        <img src="assets/character-mophy.png" alt="墨非">
      </figure>

      <section class="dialogue-panel" aria-label="角色對話">
        <div>
          <small>墨非 Mophy</small>
        </div>
        <p>妳來了。今天想從哪裡開始探索？我陪妳。</p>
        <button class="dialogue-next" type="button">繼續對話</button>
      </section>

      <div class="bag-dock" aria-label="背包功能">
        <div class="explore-tools" aria-label="探索功能">
          <button class="map-square-button" type="button" data-bag="map">
            <span><img src="assets/icons/map.webp" alt="" loading="lazy"></span>
            <strong>探索地圖</strong>
          </button>
          <button class="clue-square-button" type="button" data-bag="clue">
            <span><img src="assets/icons/puzzle.webp" alt="" loading="lazy"></span>
            <strong>線索蒐集</strong>
          </button>
        </div>
      </div>
    </section>
  </main>

  <section class="bag-modal" data-modal="map" role="dialog" aria-modal="true" aria-label="探索地圖" hidden>
    <div class="modal-card map-bag">
      <header>
        <div>
          <small>AREA SELECT</small>
          <h2>選擇探索位置</h2>
        </div>
        <button class="modal-close" type="button" aria-label="關閉探索地圖">×</button>
      </header>
      <div class="location-select-grid" aria-label="位置清單"></div>
    </div>
  </section>

  <section class="bag-modal" data-modal="clue" role="dialog" aria-modal="true" aria-label="線索收集" hidden>
    <div class="modal-card clue-bag">
      <header>
        <div>
          <small>PHOTO PUZZLE</small>
          <h2>線索收集</h2>
        </div>
        <button class="modal-close" type="button" aria-label="關閉線索收集">×</button>
      </header>
      <div class="clue-board">
        <div class="clue-puzzle" aria-label="合照拼圖"></div>
        <aside class="clue-note">
          <strong>密碼 🔑</strong>
          <p>在不同地點找到碎片，收集後會自動放回拼圖板，蒐集完成可以獲得手機密碼。</p>
          <span class="clue-progress">0 / 20</span>
          <code class="clue-password" hidden>PHYMO-HEART404</code>
        </aside>
      </div>
    </div>
  </section>

  <section class="bag-modal" data-modal="video" role="dialog" aria-modal="true" aria-label="影片背包" hidden>
    <div class="modal-card video-bag">
      <div class="tablet-device is-locked" aria-label="平板影片播放器">
        <div class="tablet-camera" aria-hidden="true"></div>
        <section class="video-lock" aria-label="影片密碼鎖">
          <button class="modal-close" type="button" aria-label="關閉影片背包">×</button>
          <small>[LOCKED DEVICE]</small>
          <h2>手機影片已加密</h2>
          <p>完成線索收集後，輸入取得的長串密碼才能播放。</p>
          <label>
            <span>ACCESS PASSWORD</span>
            <input class="video-password-input" type="password" autocomplete="off" placeholder="輸入線索密碼">
          </label>
          <button class="video-unlock-button" type="button">解除鎖定</button>
          <em class="video-lock-message" aria-live="polite"></em>
        </section>
        <div class="bag-video-layout">
          <section class="tablet-screen" aria-label="影片播放畫面">
            <header>
              <div>
                <small>[通知]</small>
                <h2>影片已下載完成</h2>
              </div>
              <button class="modal-close" type="button" aria-label="關閉影片背包">×</button>
            </header>
            <video class="bag-video-player" controls poster="assets/video_posters/video1.webp">
              <source src="assets/video/video1.mp4" type="video/mp4">
            </video>
            <iframe class="bag-youtube-player"  src="https://www.youtube.com/embed/oQpA-3m9Q7o" title="Lacuna" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
          </section>
          <aside class="bag-video-list" aria-label="影片選單">
            <small>VIDEO MENU</small>
            <button class="is-active" type="button" data-video-type="local" data-video-src="assets/video/video1.mp4" data-video-poster="assets/video_posters/video1.webp" data-video-title="小破群開發日常">
              <img src="assets/video_posters/video1.webp" alt="">
              <span>小破群開發日常</span>
            </button>
            <button type="button" data-video-type="youtube" data-youtube-src="https://www.youtube.com/embed/oQpA-3m9Q7o?rel=0&playsinline=1" data-video-title="Lacuna">
              <img src="assets/video_posters/Lacuna.webp" alt="">
              <span>Lacuna</span>
            </button>
            <button type="button" data-video-type="youtube" data-youtube-src="https://www.youtube.com/embed/vJlMSHuxUFg?rel=0&playsinline=1" data-video-title="Phymo">
              <img src="assets/video_posters/phymo.webp" alt="">
              <span>Phymo</span>
            </button>
          </aside>
        </div>
        <div class="tablet-home" aria-hidden="true"></div>
      </div>
    </div>
  </section>

  <section class="bag-modal" data-modal="photo" role="dialog" aria-modal="true" aria-label="照片背包" hidden>
    <div class="modal-card photo-bag">
      <header>
        <div>
          <small>PHOTO BAG</small>
          <h2>佈告欄</h2>
        </div>
        <button class="modal-close" type="button" aria-label="關閉照片背包">×</button>
      </header>
      <div class="photo-grid" aria-live="polite"></div>
    </div>
  </section>

  <section class="photo-lightbox" role="dialog" aria-modal="true" aria-label="照片放大檢視" hidden>
    <button class="lightbox-close" type="button" aria-label="關閉照片">×</button>
    <figure>
      <img src="assets/companyphoto/01.webp" alt="">
      <figcaption>深藍企劃日</figcaption>
    </figure>
  </section>

  <audio class="bg-music" src="assets/music/Phymo.mp3" loop preload="auto"></audio>

  <script>
    const locations = [
      {

        image: "assets/office/hall.webp",
        character: "assets/character/mophy-normal.png",

        ]
      },
      {
        id: "department",

        image: "assets/office/department.webp",
        character: "assets/character/mophy-shy.png",
        fragments: [2, 3],
        lines: [

        ]

        character: "assets/character/mophy-normal.png",

    const sceneImage = document.querySelector(".scene-image");
    const sceneGlow = document.querySelector(".scene-glow");

    const cluePassword = document.querySelector(".clue-password");
    const characterImage = document.querySelector(".character-stand img");
    const dialogueText = document.querySelector(".dialogue-panel p");
    const dialogueNext = document.querySelector(".dialogue-next");
    const bagVideo = document.querySelector(".bag-video-player");
    const bagYoutube = document.querySelector(".bag-youtube-player");

    const videoPasswordInput = document.querySelector(".video-password-input");
    const videoUnlockButton = document.querySelector(".video-unlock-button");
    const videoLockMessage = document.querySelector(".video-lock-message");
    const photoGrid = document.querySelector(".photo-grid");
    const lightbox = document.querySelector(".photo-lightbox");
    const fallbackPhotos = [

      { title: "員工旅遊出國啦~美女帥哥照", src: "assets/companyphoto/12.webp" },

      { title: "偷拍兩位男神(灬ºωº灬)", src: "assets/companyphoto/18.webp" },

      { title: "雙雙賜福，天降財運 哈哈", src: "assets/companyphoto/20.webp" },

      { title: "公司野餐日", src: "assets/companyphoto/28.webp" },

      { title: "公司電玩展", src: "assets/companyphoto/30.webp" },
      { title: "黃森電玩展造型", src: "assets/companyphoto/31.webp" },
      { title: "公司電玩展", src: "assets/companyphoto/32.webp" }
    ];
    let activeLocation = locations[0];
    let dialogueIndex = 0;
    let activeDialogueLines = [];
    const collectedFragments = new Set();
    const fragmentPositions = new Map();
    const puzzleTotal = 26;
    const puzzleCols = 7;
    const puzzleRows = 4;
    const puzzleImage = "assets/icons/pixelate.webp";
    const videoPassword = "PHYMO-HEART404";
    let videoUnlocked = false;
    let bgMusicEnabled = true;

    locations.forEach((location) => {
      if (location.id !== "hall") {
        const preload = new Image();
        preload.src = location.image;
      }
    });

    function renderLocationSelect() {
      locationSelectGrid.replaceChildren();
      locations.forEach((location) => {
        const button = document.createElement("button");
        const collectedCount = location.fragments.filter((fragment) => collectedFragments.has(fragment)).length;
        button.className = "location-select-card";
        button.type = "button";
        button.dataset.location = location.id;
        button.innerHTML = `
          <img src="${location.image}" alt="">
          <span>
            <strong>${location.name}</strong>
            <em>${collectedCount}/${location.fragments.length} 拼圖碎片</em>
          </span>
        `;
        button.addEventListener("click", () => {
          activateLocation(location.id);
          document.querySelector('[data-modal="map"]').hidden = true;
        });
        locationSelectGrid.append(button);
      });
    }

    function renderFragments() {
      fragmentTray.replaceChildren();
      activeLocation.fragments.forEach((fragment) => {
        if (collectedFragments.has(fragment)) return;
        const button = document.createElement("button");
        const position = getFragmentPosition(activeLocation.id, fragment);
        button.type = "button";
        button.dataset.fragment = fragment;
        button.style.left = `${position.x}%`;
        button.style.top = `${position.y}%`;
        button.innerHTML = `
          <span><img src="assets/icons/piece.webp" alt=""></span>
          <strong>拼圖碎片</strong>
        `;
        button.addEventListener("click", () => collectFragment(fragment, button));
        fragmentTray.append(button);
      });
    }

    function getFragmentPosition(locationId, fragment) {
      const key = `${locationId}-${fragment}`;
      if (!fragmentPositions.has(key)) {
        fragmentPositions.set(key, createFragmentPosition());
      }
      return fragmentPositions.get(key);
    }

    function createFragmentPosition() {
      let position = { x: 50, y: 50 };
      for (let attempt = 0; attempt < 40; attempt += 1) {
        position = {
          x: 10 + Math.random() * 80,
          y: 18 + Math.random() * 54
        };

        const overlapsLocationCard = position.x < 35 && position.y < 45;
        const overlapsTopButtons = position.x > 55 && position.y < 32;
        const overlapsDialogue = position.x > 22 && position.x < 78 && position.y > 62;
        if (!overlapsLocationCard && !overlapsTopButtons && !overlapsDialogue) return position;
      }
      return position;
    }

    function renderClues() {
      cluePuzzle.replaceChildren();
      for (let index = 0; index < puzzleTotal; index += 1) {
        const piece = document.createElement("span");
        const isCollected = collectedFragments.has(index);
        piece.className = `clue-piece${isCollected ? " is-collected" : ""}`;
        const pieceX = index % puzzleCols;
        const pieceY = Math.floor(index / puzzleCols);
        piece.style.setProperty("--pos-x", `${pieceX === 0 ? 0 : (pieceX / (puzzleCols - 1)) * 100}%`);
        piece.style.setProperty("--pos-y", `${pieceY === 0 ? 0 : (pieceY / (puzzleRows - 1)) * 100}%`);
        piece.style.backgroundImage = `url("${puzzleImage}")`;
        piece.textContent = isCollected ? "" : String(index + 1).padStart(2, "0");
        cluePuzzle.append(piece);
      }
      clueProgress.textContent = `${collectedFragments.size} / ${puzzleTotal}`;
      const isComplete = collectedFragments.size >= puzzleTotal;
      cluePassword.hidden = !isComplete;
      if (isComplete) {
        cluePassword.textContent = videoPassword;
      }
      renderLocationSelect();
    }

    function collectFragment(fragment, trigger) {
      if (collectedFragments.has(fragment)) return;
      trigger.disabled = true;
      trigger.classList.add("is-picking");
      window.setTimeout(() => {
        finishCollectFragment(fragment);
      }, 560);
    }

    function finishCollectFragment(fragment) {
      collectedFragments.add(fragment);
      dialogueText.textContent = `找到第 ${String(fragment + 1).padStart(2, "0")} 片拼圖了。先放進線索蒐集裡，等等一起拼成線索。`;
      renderFragments();
      renderClues();
    }

    function pickRandomLines(lines, count = 3) {
      return [...lines]
        .sort(() => Math.random() - 0.5)
        .slice(0, Math.min(count, lines.length));
    }

    function activateLocation(id) {
      const location = locations.find((item) => item.id === id) || locations[0];
      activeLocation = location;
      dialogueIndex = 0;
      activeDialogueLines = pickRandomLines(location.lines, 3);
      sceneImage.classList.add("is-changing");
      window.setTimeout(() => {
        sceneImage.src = location.image;
        sceneImage.alt = location.name;
        sceneImage.classList.remove("is-changing");
      }, 160);
      locationTitle.textContent = location.name;
      locationDesc.textContent = location.desc;
      characterImage.src = location.character;
      dialogueText.textContent = activeDialogueLines[0];
      renderFragments();
      renderLocationSelect();
    }

    dialogueNext.addEventListener("click", () => {
      dialogueIndex = (dialogueIndex + 1) % activeDialogueLines.length;
      dialogueText.textContent = activeDialogueLines[dialogueIndex];
    });

    document.querySelectorAll(".bag-button, .map-square-button, .clue-square-button").forEach((button) => {
      button.addEventListener("click", () => {
        const modal = document.querySelector(`[data-modal="${button.dataset.bag}"]`);
        if (modal) {
          modal.hidden = false;
          if (button.dataset.bag === "video" && !videoUnlocked) {
            window.setTimeout(() => videoPasswordInput.focus(), 80);
          }
        }
      });
    });

    document.querySelectorAll(".modal-close").forEach((button) => {
      button.addEventListener("click", () => {
        const modal = button.closest(".bag-modal");
        modal.hidden = true;
        stopBagMedia();
      });
    });

    document.querySelectorAll(".bag-modal").forEach((modal) => {
      modal.addEventListener("click", (event) => {
        if (event.target === modal) {
          modal.hidden = true;
          stopBagMedia();
        }
      });
    });

    function stopBagMedia() {
      bagVideo.pause();
      bagYoutube.src = "about:blank";
      resumeBgMusic();
    }

    async function playBgMusic() {
      if (!bgMusicEnabled) return;
      try {
        await bgMusic.play();
        musicToggle.textContent = "音樂暫停";
        musicToggle.setAttribute("aria-pressed", "true");
      } catch (error) {
        musicToggle.textContent = "音樂繼續";
        musicToggle.setAttribute("aria-pressed", "false");
      }
    }

    function pauseBgMusic() {
      bgMusic.pause();
      musicToggle.textContent = "音樂繼續";
      musicToggle.setAttribute("aria-pressed", "false");
    }

    function resumeBgMusic() {
      if (bgMusicEnabled) playBgMusic();
    }

    function toggleBgMusic() {
      bgMusicEnabled = bgMusic.paused;
      if (bgMusicEnabled) {
        playBgMusic();
      } else {
        pauseBgMusic();
      }
    }

    musicToggle.addEventListener("click", toggleBgMusic);
    document.addEventListener("pointerdown", playBgMusic, { once: true });
    document.addEventListener("keydown", playBgMusic, { once: true });

    function unlockVideo() {
      const value = videoPasswordInput.value.trim();
      if (value !== videoPassword) {
        videoLockMessage.textContent = "密碼錯誤，請回線索蒐集確認。";
        videoPasswordInput.select();
        return;
      }
      videoUnlocked = true;
      tabletDevice.classList.remove("is-locked");
      videoLockMessage.textContent = "";
    }

    videoUnlockButton.addEventListener("click", unlockVideo);
    videoPasswordInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") unlockVideo();
    });

    document.querySelectorAll(".bag-video-list button").forEach((button) => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".bag-video-list button").forEach((item) => item.classList.remove("is-active"));
        button.classList.add("is-active");
        if (button.dataset.videoType === "youtube") {
          bagVideo.pause();
          pauseBgMusic();
          bagVideo.hidden = true;
          bagYoutube.hidden = false;
          bagYoutube.src = button.dataset.youtubeSrc;
          return;
        }
        bagYoutube.src = "about:blank";
        bagYoutube.hidden = true;
        bagVideo.hidden = false;
        pauseBgMusic();
        bagVideo.poster = button.dataset.videoPoster;
        bagVideo.src = button.dataset.videoSrc;
        bagVideo.load();
      });
    });

    bagVideo.addEventListener("play", pauseBgMusic);

    function renderPhotos(photos) {
      photoGrid.replaceChildren();
      photos.forEach((photo) => {
        const button = document.createElement("button");
        button.type = "button";
        button.dataset.photoSrc = photo.src;
        button.dataset.photoCaption = photo.title;
        button.innerHTML = `
          <span class="photo-loading">Loading</span>
          <img src="${photo.src}" alt="${photo.title}" loading="lazy">
          <span>${photo.title}</span>
        `;
        const image = button.querySelector("img");
        image.addEventListener("load", () => button.classList.add("is-loaded"));
        image.addEventListener("error", () => {
          button.classList.add("is-error");
          button.querySelector(".photo-loading").textContent = "載入失敗";
        });
        if (image.complete && image.naturalWidth > 0) {
          button.classList.add("is-loaded");
        }
        photoGrid.append(button);
      });
    }

    async function loadPhotos() {
      try {
        const response = await fetch("assets/companyphoto.json", { cache: "no-store" });
        if (!response.ok) throw new Error("photo json unavailable");
        const photos = await response.json();
        renderPhotos(photos);
      } catch (error) {
        renderPhotos(fallbackPhotos);
      }
    }

    photoGrid.addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      const image = lightbox.querySelector("img");
      image.src = button.dataset.photoSrc;
      image.alt = button.dataset.photoCaption;
      lightbox.querySelector("figcaption").textContent = button.dataset.photoCaption;
      lightbox.hidden = false;
    });

    document.querySelector(".lightbox-close").addEventListener("click", () => {
      lightbox.hidden = true;
    });

    lightbox.addEventListener("click", (event) => {
      if (event.target === lightbox) lightbox.hidden = true;
    });

    document.addEventListener("keydown", (event) => {
      if (event.key !== "Escape") return;
      document.querySelectorAll(".bag-modal").forEach((modal) => modal.hidden = true);
      lightbox.hidden = true;
      stopBagMedia();
    });

    document.querySelector(".map-stage").addEventListener("pointermove", (event) => {
      const bounds = event.currentTarget.getBoundingClientRect();
      const x = ((event.clientX - bounds.left) / bounds.width) * 2 - 1;
      const y = ((event.clientY - bounds.top) / bounds.height) * 2 - 1;
      event.currentTarget.style.setProperty("--look-x", x.toFixed(3));
      event.currentTarget.style.setProperty("--look-y", y.toFixed(3));
    });

    document.querySelector(".map-stage").addEventListener("pointerleave", (event) => {
      event.currentTarget.style.setProperty("--look-x", "0");
      event.currentTarget.style.setProperty("--look-y", "0");
    });

    activateLocation("hall");
    renderClues();
    loadPhotos();
  </script>
