<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phymo心跳實驗</title>
  <link rel="preload" as="image" href="assets/page-video.webp">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="video.css">
</head>
<body>
  <main class="live-app" aria-label="小破群開發中直播介面">
    <header class="live-header">
      <div class="brand">
        <h1>小破群開發中<span>.exe</span></h1>
        <p>— Phymo辦公室的小小日常 —</p>
      </div>
      <div class="stream-meta">
        <strong>LIVE</strong>
        <span>♟ 8,520</span>
      </div>
      <section class="viewer-status" aria-label="玩家資訊">
        <span class="hearts">♡♡</span>
        <div>
          <small>粉絲等級 Lv.99</small>
          <i><b></b></i>
        </div>
        <small>2350/5000</small>
        <button type="button">應援福利</button>
      </section>
      <nav class="header-actions" aria-label="快捷功能">
        <button type="button">♧<small>公告</small></button>
        <button type="button">⚙<small>設定</small></button>
        <button type="button" class="has-new">✉<small>信件</small></button>
        <button type="button">♙<small>背包</small></button>
        <button type="button">▣<small>存檔</small></button>
        <a href="index.html">↪<small>結束</small></a>
      </nav>
    </header>

    <div class="dashboard">
      <section class="media-column">
        <section class="panel featured-panel">
          <header class="panel-head">
            <h2>✦ 最新影片</h2>
            <span class="feature-tag">小破群開發日常 #12</span>
          </header>
          <div class="featured-content">
            <aside class="video-shelf-column" aria-label="影片列表">
              <header class="video-shelf-title">
                <h3>影片列表</h3>
                <button type="button">全部 ›</button>
              </header>
              <div class="video-shelf">
                <button class="clip is-active" type="button" data-video="assets/video/video1.mp4" data-poster="assets/video_posters/video1.webp" data-title="小破群開發日常" data-subtitle="video1">
                  <img src="assets/video_posters/video1.webp" alt="" loading="lazy" decoding="async"><b>NEW</b><span>Phymo<br>小破群開發日常</span>
                </button>
              </div>
            </aside>
            <figure class="featured-player">
              <video class="featured-video" poster="assets/video_posters/video1.webp" preload="metadata">
                <source src="assets/video/video1.mp4" type="video/mp4">
              </video>
              <figcaption>
                <strong>小破群開發日常</strong>
                <em>Phymo</em>
              </figcaption>
              <div class="featured-controls">
                <div class="featured-progress"><i></i></div>
                <button class="feature-play" type="button" aria-label="播放或暫停">▶</button>
                <button class="feature-restart" type="button" aria-label="重新播放">↺</button>
                <span class="feature-time">00:00 / 00:00</span>
                <button class="feature-mute" type="button" aria-label="靜音或恢復音量">♬</button>
                <span>1080P</span>
                <button class="feature-fullscreen" type="button" aria-label="全螢幕">⛶</button>
              </div>
            </figure>
          </div>
        </section>
      </section>

      <section class="panel photo-wall" aria-label="公司合照展覽牆">
        <header class="panel-head">
          <h2>✦ 公司合照展覽牆</h2>
          <span>OUR MOMENTS</span>
        </header>
        <div class="photo-carousel">
          <div class="photo-viewer">
            <button class="photo-arrow photo-prev" type="button" aria-label="上一張合照">‹</button>
            <button class="photo-featured" type="button" aria-label="放大檢視目前合照">
              <img src="assets/companyphoto/01.webp" alt="水族館企劃合照" decoding="async">
              <span><strong>深藍企劃日</strong><small>點擊放大檢視</small></span>
            </button>
            <button class="photo-arrow photo-next" type="button" aria-label="下一張合照">›</button>
          </div>
          <div class="photo-footer">
            <div class="photo-thumbs" aria-label="合照選單">
              <button class="is-active" type="button" data-photo-src="assets/companyphoto/01.webp" data-photo-alt="水族館企劃合照" data-photo-caption="深藍企劃日" aria-label="顯示深藍企劃日">
                <img src="assets/companyphoto/01.webp" alt="" decoding="async">
              </button>
              <button type="button" data-photo-src="assets/companyphoto/02.webp" data-photo-alt="團隊水族館合照" data-photo-caption="全員集合" aria-label="顯示全員集合">
                <img src="assets/companyphoto/02.webp" alt="" loading="lazy" decoding="async">
              </button>
              <button type="button" data-photo-src="assets/companyphoto/03.webp" data-photo-alt="團隊洗衣日合照" data-photo-caption="洗衣日留念" aria-label="顯示洗衣日留念">
                <img src="assets/companyphoto/03.webp" alt="" loading="lazy" decoding="async">
              </button>
            </div>
            <p class="photo-counter"><strong>01</strong> / <span>03</span></p>
          </div>
        </div>
      </section>

      <section class="panel explore-panel" aria-label="辦公室探索">
        <header class="panel-head">
          <h2>✦ 辦公室探索 <small>?</small></h2>
          <span>探索進度 <strong>32%</strong> »</span>
        </header>
        <div class="office-map" data-room="hall">
          <div class="office-stage">
            <img class="office-scene office-scene-back" src="assets/office/hall.webp" alt="辦公室大廳探索區" decoding="async">
            <img class="office-scene office-scene-front" src="assets/office/hall.webp" alt="" aria-hidden="true" decoding="async">
            <span class="office-light" aria-hidden="true"></span>
          </div>
          <p class="room-status"><strong>辦公大廳</strong><small>SCENE 01 / 10</small></p>
          <button class="hotspot meeting" type="button" data-room-target="motionroom">會議室<small>(新劇情)</small></button>
          <button class="hotspot lounge" type="button" data-room-target="restroom">休息區<small>(可互動)</small></button>
          <button class="hotspot desk" type="button" data-room-target="department">角色們的工位<small>(可互動)</small></button>
          <button class="hotspot file" type="button" data-room-target="treasurehouse">資料區<small>(可收集)</small></button>
          <span class="mini-map" aria-hidden="true"></span>
          <div class="move-pad" aria-label="方向移動">
            <button type="button" data-room-move="-1" aria-label="上一個場景">⌃</button>
            <button type="button" data-room-move="-1" aria-label="上一個場景">‹</button>
            <i></i>
            <button type="button" data-room-move="1" aria-label="下一個場景">›</button>
            <button type="button" data-room-move="1" aria-label="下一個場景">⌄</button>
          </div>
          <!-- <button class="start-explore" type="button"><span>🌿</span><strong>開始探索<br>辦公室</strong><small>ENTER</small></button> -->
        </div>
      </section>

    </div>
  </main>
  <section class="photo-lightbox" role="dialog" aria-modal="true" aria-label="合照放大檢視" hidden>
    <button class="photo-lightbox-close" type="button" aria-label="關閉合照">×</button>
    <figure>
      <img src="assets/companyphoto/01.webp" alt="水族館企劃合照">
      <figcaption>深藍企劃日</figcaption>
    </figure>
  </section>

  <script>
    const featuredVideo = document.querySelector(".featured-video");
    const featuredPlayer = document.querySelector(".featured-player");
    const featuredTitle = document.querySelector(".featured-player figcaption strong");
    const featuredSubtitle = document.querySelector(".featured-player figcaption em");
    const clips = document.querySelectorAll(".clip");
    const playButton = document.querySelector(".feature-play");
    const restartButton = document.querySelector(".feature-restart");
    const muteButton = document.querySelector(".feature-mute");
    const fullscreenButton = document.querySelector(".feature-fullscreen");
    const progress = document.querySelector(".featured-progress i");
    const timeText = document.querySelector(".feature-time");
    const photoWall = document.querySelector(".photo-wall");
    const photoThumbs = [...document.querySelectorAll(".photo-thumbs button")];
    const activePhoto = document.querySelector(".photo-featured img");
    const activeCaption = document.querySelector(".photo-featured strong");
    const photoCounter = document.querySelector(".photo-counter strong");
    const photoOpenButton = document.querySelector(".photo-featured");
    const photoLightbox = document.querySelector(".photo-lightbox");
    const lightboxImage = document.querySelector(".photo-lightbox img");
    const lightboxCaption = document.querySelector(".photo-lightbox figcaption");
    let activePhotoIndex = 0;
    let photoTimer;
    const officeMap = document.querySelector(".office-map");
    const officeStage = document.querySelector(".office-stage");
    const officeScenes = document.querySelectorAll(".office-scene");
    const roomName = document.querySelector(".room-status strong");
    const roomCount = document.querySelector(".room-status small");
    const roomControls = document.querySelectorAll("[data-room-target], [data-room-move]");
    const officeRooms = [
      { id: "hall", label: "辦公大廳" },
      { id: "department", label: "開發部門" },
      { id: "motionroom", label: "會議室" },
      { id: "backendlead", label: "主管辦公室" },
      { id: "bar", label: "茶水吧台" },
      { id: "restroom", label: "休息區" },
      { id: "machineroom", label: "機房" },
      { id: "treasurehouse", label: "典藏室" },
      { id: "boytoilet", label: "男洗手間" },
      { id: "girltoilet", label: "女洗手間" }
    ];
    let activeRoomIndex = 0;
    let roomChangeTimer;

    officeRooms.slice(1).forEach((room) => {
      const preload = new Image();
      preload.src = `assets/office/${room.id}.webp`;
    });

    function showPhoto(index) {
      activePhotoIndex = (index + photoThumbs.length) % photoThumbs.length;
      const selected = photoThumbs[activePhotoIndex];
      activePhoto.src = selected.dataset.photoSrc;
      activePhoto.alt = selected.dataset.photoAlt;
      activeCaption.textContent = selected.dataset.photoCaption;
      photoCounter.textContent = String(activePhotoIndex + 1).padStart(2, "0");
      photoThumbs.forEach((thumb, thumbIndex) => {
        thumb.classList.toggle("is-active", thumbIndex === activePhotoIndex);
      });
    }

    function startPhotoCarousel() {
      window.clearInterval(photoTimer);
      photoTimer = window.setInterval(() => showPhoto(activePhotoIndex + 1), 5500);
    }

    photoThumbs.forEach((thumb, index) => {
      thumb.addEventListener("click", () => {
        showPhoto(index);
        startPhotoCarousel();
      });
    });

    document.querySelector(".photo-prev").addEventListener("click", () => {
      showPhoto(activePhotoIndex - 1);
      startPhotoCarousel();
    });

    document.querySelector(".photo-next").addEventListener("click", () => {
      showPhoto(activePhotoIndex + 1);
      startPhotoCarousel();
    });

    photoOpenButton.addEventListener("click", () => {
      lightboxImage.src = activePhoto.src;
      lightboxImage.alt = activePhoto.alt;
      lightboxCaption.textContent = activeCaption.textContent;
      photoLightbox.hidden = false;
      window.clearInterval(photoTimer);
    });

    document.querySelector(".photo-lightbox-close").addEventListener("click", () => {
      photoLightbox.hidden = true;
      startPhotoCarousel();
    });

    photoLightbox.addEventListener("click", (event) => {
      if (event.target === photoLightbox) {
        photoLightbox.hidden = true;
        startPhotoCarousel();
      }
    });

    photoWall.addEventListener("pointerenter", () => window.clearInterval(photoTimer));
    photoWall.addEventListener("pointerleave", startPhotoCarousel);
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !photoLightbox.hidden) {
        photoLightbox.hidden = true;
        startPhotoCarousel();
      }
    });
    startPhotoCarousel();

    function formatTime(seconds) {
      if (!Number.isFinite(seconds)) return "00:00";
      const minutes = Math.floor(seconds / 60);
      const remaining = Math.floor(seconds % 60);
      return `${String(minutes).padStart(2, "0")}:${String(remaining).padStart(2, "0")}`;
    }

    function updatePlaybackDisplay() {
      const percent = featuredVideo.duration
        ? (featuredVideo.currentTime / featuredVideo.duration) * 100
        : 0;
      progress.style.width = `${percent}%`;
      timeText.textContent = `${formatTime(featuredVideo.currentTime)} / ${formatTime(featuredVideo.duration)}`;
    }

    function updateVideoOrientation() {
      const isPortrait = featuredVideo.videoHeight > featuredVideo.videoWidth;
      featuredPlayer.classList.toggle("is-portrait", isPortrait);
      featuredPlayer.classList.toggle("is-landscape", !isPortrait);
    }

    clips.forEach((clip) => {
      clip.addEventListener("click", () => {
        clips.forEach((item) => item.classList.remove("is-active"));
        clip.classList.add("is-active");
        featuredVideo.pause();
        featuredVideo.poster = clip.dataset.poster;
        featuredVideo.src = clip.dataset.video;
        featuredVideo.load();
        featuredTitle.textContent = clip.dataset.title;
        featuredSubtitle.textContent = clip.dataset.subtitle;
        playButton.textContent = "▶";
        updatePlaybackDisplay();
      });
    });

    playButton.addEventListener("click", () => {
      if (featuredVideo.paused) {
        featuredVideo.play();
        return;
      }
      featuredVideo.pause();
    });

    restartButton.addEventListener("click", () => {
      featuredVideo.currentTime = 0;
      featuredVideo.play();
    });

    muteButton.addEventListener("click", () => {
      featuredVideo.muted = !featuredVideo.muted;
      muteButton.textContent = featuredVideo.muted ? "♩" : "♬";
    });

    fullscreenButton.addEventListener("click", () => {
      featuredVideo.requestFullscreen?.();
    });

    featuredVideo.addEventListener("play", () => {
      playButton.textContent = "Ⅱ";
    });
    featuredVideo.addEventListener("pause", () => {
      playButton.textContent = "▶";
    });
    featuredVideo.addEventListener("loadedmetadata", () => {
      updateVideoOrientation();
      updatePlaybackDisplay();
    });
    featuredVideo.addEventListener("timeupdate", updatePlaybackDisplay);

    function showOfficeRoom(index) {
      activeRoomIndex = (index + officeRooms.length) % officeRooms.length;
      const room = officeRooms[activeRoomIndex];
      officeStage.classList.add("is-changing");
      window.clearTimeout(roomChangeTimer);
      roomChangeTimer = window.setTimeout(() => {
        officeScenes.forEach((image, sceneIndex) => {
          image.src = `assets/office/${room.id}.webp`;
          if (sceneIndex === 0) image.alt = `${room.label}探索區`;
        });
        officeMap.dataset.room = room.id;
        roomName.textContent = room.label;
        roomCount.textContent = `SCENE ${String(activeRoomIndex + 1).padStart(2, "0")} / ${officeRooms.length}`;
        officeStage.classList.remove("is-changing");
      }, 170);
    }

    roomControls.forEach((button) => {
      button.addEventListener("click", () => {
        if (button.dataset.roomTarget) {
          const targetIndex = officeRooms.findIndex((room) => room.id === button.dataset.roomTarget);
          if (targetIndex >= 0) showOfficeRoom(targetIndex);
          return;
        }
        showOfficeRoom(activeRoomIndex + Number(button.dataset.roomMove));
      });
    });

    officeMap.addEventListener("pointermove", (event) => {
      const bounds = officeMap.getBoundingClientRect();
      const x = ((event.clientX - bounds.left) / bounds.width) * 2 - 1;
      const y = ((event.clientY - bounds.top) / bounds.height) * 2 - 1;
      officeMap.style.setProperty("--look-x", x.toFixed(3));
      officeMap.style.setProperty("--look-y", y.toFixed(3));
    });

    officeMap.addEventListener("pointerleave", () => {
      officeMap.style.setProperty("--look-x", "0");
      officeMap.style.setProperty("--look-y", "0");
    });

  </script>
</body>
</html>
